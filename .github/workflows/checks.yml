name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  documentation-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required documentation
        run: |
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          echo "Documentation files are present."
